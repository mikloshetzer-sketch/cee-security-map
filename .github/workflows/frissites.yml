name: Update CEE security data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cee-security-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser

      - name: Validate taxonomy and classifier
        run: |
          python -m json.tool security_taxonomy.json > /dev/null

          python -m py_compile scripts/security_classifier.py

          python scripts/security_classifier.py \
            --title "Russian missile fell in eastern Poland" \
            --summary "Authorities secured the impact site." \
            --country Poland \
            --compact > classifier_test.json

          python - <<'PY'
          import json

          with open("classifier_test.json","r",encoding="utf-8") as f:
              result=json.load(f)

          assert result["matched_rule_id"]
          assert result["family"]=="air"
          assert result["actual_incident"] is True

          print("Classifier OK")
          PY

          rm classifier_test.json

      - name: Update GDELT and RSS data
        run: |
          python scripts/update_data.py

      - name: Fetch local media events
        run: |
          python scripts/fetch_local_sources.py

      - name: Validate local events
        run: |
          python - <<'PY'
          import json

          with open("data/local_events.geojson","r",encoding="utf-8") as f:
              data=json.load(f)

          assert data["type"]=="FeatureCollection"

          for feature in data["features"]:
              p=feature["properties"]

              required=[
                  "incident_family",
                  "incident_subcategory",
                  "incident_subtype",
                  "classification_confidence",
                  "matched_rule_id",
                  "article_role",
                  "actual_incident",
                  "fingerprint"
              ]

              missing=[x for x in required if x not in p]

              if missing:
                  raise Exception(
                      f"Missing classifier fields: {missing}"
                  )

          print("Local event validation OK")
          PY

      - name: Build infrastructure proximity
        run: |
          python scripts/build_infra_proximity.py

      - name: Archive old events
        run: |
          python scripts/archive_events.py

      - name: Enrich security outputs
        run: |
          python scripts/enrich_security_outputs.py

      - name: Commit changes
        run: |
          git config user.name "cee-bot"
          git config user.email "cee-bot@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "auto: update classified CEE security data"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
